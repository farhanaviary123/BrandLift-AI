<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrandLift AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --border: #2a2a2a;
            --text: #f5f5f5;
            --text-muted: #888;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
        }

        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        h1 {
            font-size: clamp(1.75rem, 5vw, 2.25rem);
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 40px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input[type="url"] {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="url"]::placeholder {
            color: var(--text-muted);
        }

        input[type="url"]:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            color: white;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .state-loading {
            display: none;
        }

        .state-loading.visible {
            display: block;
        }

        .state-form.visible {
            display: block;
        }

        .state-form {
            display: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            margin: 0 auto 20px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .error-msg {
            margin-top: 12px;
            padding: 12px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 0.9rem;
            text-align: left;
            display: none;
        }

        .error-msg.visible {
            display: block;
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BrandLift AI</h1>
        <p class="tagline">Generate a brand moodboard from any website URL</p>

        <div class="card state-form visible" id="formState">
            <form id="analyzeForm" novalidate>
                <div class="form-group">
                    <label for="url">Website URL</label>
                    <input
                        type="url"
                        id="url"
                        name="url"
                        placeholder="https://example.com"
                        required
                        autocomplete="url"
                    >
                </div>
                <p class="error-msg" id="errorMsg"></p>
                <button type="submit" class="btn" id="submitBtn">Generate Moodboard</button>
            </form>
        </div>

        <div class="card state-loading" id="loadingState">
            <div class="spinner"></div>
            <p class="loading-text">Generating the moodboard for you...</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('analyzeForm');
        const urlInput = document.getElementById('url');
        const submitBtn = document.getElementById('submitBtn');
        const formState = document.getElementById('formState');
        const loadingState = document.getElementById('loadingState');
        const errorMsg = document.getElementById('errorMsg');

        function showError(message) {
            errorMsg.textContent = message || 'Something went wrong. Please try again.';
            errorMsg.classList.add('visible');
        }

        function hideError() {
            errorMsg.classList.remove('visible');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const url = urlInput.value.trim();
            if (!url) {
                showError('Please enter a URL.');
                return;
            }
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                showError('URL must start with http:// or https://');
                return;
            }

            formState.classList.remove('visible');
            loadingState.classList.add('visible');
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url }),
                });

                const data = await res.json().catch(() => ({}));

                if (res.ok && data.success) {
                    if (data.data) {
                        try {
                            sessionStorage.setItem('brand_analysis', JSON.stringify(data.data));
                        } catch (_) {}
                    }
                    window.location.href = data.redirect || '/moodboard.html';
                    return;
                }

                showError(data.error || `Request failed (${res.status})`);
            } catch (err) {
                showError('Network error. Make sure the server is running.');
            } finally {
                loadingState.classList.remove('visible');
                formState.classList.add('visible');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
